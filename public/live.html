<!doctype html>
<html>
<head><meta charset="utf-8"><title>Live Tasks</title></head>
<body>
  <h2>Live task events</h2>
  <p id="status">Connecting...</p>
  <ul id="log"></ul>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const status = document.getElementById("status");
    socket.on("connect", () => (status.textContent = "Connected"));
    socket.on("disconnect", () => (status.textContent = "Disconnected"));

    ["task:created", "task:updated", "task:completed"].forEach((ev) =>
      socket.on(ev, (t) => {
        const li = document.createElement("li");
        li.textContent = `${new Date().toLocaleTimeString()} - ${ev}: ${t.title}`;
        document.getElementById("log").prepend(li);
      })
    );
  </script>
</body>
</html>
